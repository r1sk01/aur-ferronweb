name: PKGBUILD Updater

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:
    push:

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            stable: ${{ steps.ver.outputs.stable }}
            rc: ${{ steps.ver.outputs.rc }}
        steps:
            - name: Resolve upstream versions
              id: ver
              run: |
                STABLE=$(curl -fsL https://dl.ferron.sh/latest2.ferron)
                RC=$(curl -fsL https://dl.ferron.sh/latest3.ferron)
                echo "Latest stable: $STABLE"
                echo "Latest release candidate: $RC"
                echo "stable=$STABLE" >> $GITHUB_OUTPUT
                echo "rc=$RC" >> $GITHUB_OUTPUT

    update:
        needs: resolve
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - pkg: ferron
                      kind: stable
                    - pkg: ferronweb
                      kind: stable
                    - pkg: ferron-rc
                      kind: rc
                    - pkg: ferron-git
                      kind: git
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install makepkg
              run: |
                # matrix jobs may share one machine, so serialise on dpkg's lock
                sudo flock /var/lib/dpkg/lock-frontend bash -c '
                    apt-get update
                    apt-get -q -y install --no-install-recommends \
                        git pkg-config meson gcc libtool libgpgme-dev libarchive-dev \
                        ninja-build libcurl4-openssl-dev libssl-dev curl gettext \
                        python3 python3-setuptools dash gawk ca-certificates \
                        fakeroot fakechroot libarchive-tools
                '
                sudo mkdir -p /usr/local/meson
                # each job may run concurrently in one workspace, so every
                # shared step has to tolerate another job having done it
                if [ ! -f /usr/local/meson/meson.py ]; then
                    sudo git clone --depth=1 https://github.com/mesonbuild/meson.git /usr/local/meson
                fi
                if [ -f /usr/bin/meson ]; then
                    mver=$(/usr/bin/meson --version)
                    sudo mv /usr/bin/meson /usr/bin/meson-${mver}
                fi
                sudo ln -sf /usr/local/meson/meson.py /usr/bin/meson
                # a unique dir, so concurrent matrix jobs sharing a workspace
                # cannot collide on the clone
                work=$(mktemp -d)
                git clone --depth=1 https://gitlab.archlinux.org/pacman/pacman.git "$work/pacman"
                cd "$work/pacman"
                meson setup -Ddoc=disabled build
                ninja -C build
                cd build
                grep mirror scripts/libmakepkg/source/git.sh > /dev/null && {
                    cat scripts/libmakepkg/source/git.sh | sed -e "s/---mirror//" > /tmp/git$$
                    cp /tmp/git$$ scripts/libmakepkg/source/git.sh
                    rm -f /tmp/git$$
                }
                sudo meson install --no-rebuild --quiet
                cd /
                sudo rm -rf "$work"

            - name: Determine target version
              id: target
              run: |
                case "${{ matrix.kind }}" in
                    stable) echo "version=${{ needs.resolve.outputs.stable }}" >> $GITHUB_OUTPUT ;;
                    rc) echo "version=${{ needs.resolve.outputs.rc }}" >> $GITHUB_OUTPUT ;;
                    git) echo "version=" >> $GITHUB_OUTPUT ;;
                esac

            - name: Update PKGBUILD
              id: upd
              run: |
                PKG_DIR="packages/${{ matrix.pkg }}"
                TARGET="${{ steps.target.outputs.version }}"
                CURRENT=$(grep -oP 'pkgver=\K[^\s]+' "$PKG_DIR/PKGBUILD")
                echo "current=$CURRENT target=$TARGET"

                # A VCS package carries no fixed version, so there is nothing to
                # bump on a schedule. It is republished only when its PKGBUILD
                # changes in this repository.
                if [ "${{ matrix.kind }}" = "git" ]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    exit 0
                fi

                # upstream reports the RC as 3.0.0-rc.11; pkgver may not hold a hyphen
                PKGVER="${TARGET//-/}"
                echo "pkgver=$PKGVER"

                if [ "$CURRENT" = "$PKGVER" ]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    exit 0
                fi

                sed -i "s/^pkgver=.*\$/pkgver=$PKGVER/" "$PKG_DIR/PKGBUILD"
                sed -i 's/^pkgrel=.*$/pkgrel=1/' "$PKG_DIR/PKGBUILD"
                echo "changed=true" >> $GITHUB_OUTPUT

            - name: Update checksums
              if: steps.upd.outputs.changed == 'true'
              run: |
                PKG_DIR="packages/${{ matrix.pkg }}"
                TARGET="${{ steps.target.outputs.version }}"
                PKG="${{ matrix.pkg }}"

                if [ "$PKG" = "ferronweb" ]; then
                    for PKG_ARCH in x86_64 i686 armv7h aarch64 riscv64; do
                        case "$PKG_ARCH" in
                            armv7h) SRC_ARCH='armv7'; ABI='eabihf'; KEY='armv7' ;;
                            riscv64) SRC_ARCH='riscv64gc'; ABI=''; KEY='riscv64' ;;
                            *) SRC_ARCH="$PKG_ARCH"; ABI=''; KEY="$PKG_ARCH" ;;
                        esac
                        FILE_NAME="ferron-$TARGET-$SRC_ARCH-unknown-linux-gnu${ABI}.zip"
                        URL="https://dl.ferron.sh/$TARGET/$FILE_NAME"
                        echo "Downloading $URL"
                        curl -fsSL --retry 5 --retry-all-errors "$URL" -o "$FILE_NAME" || {
                            echo "ERROR: missing upstream build for $SRC_ARCH"
                            exit 1
                        }
                        CHECKSUM=$(sha256sum "$FILE_NAME" | cut -d ' ' -f 1)
                        echo "  $KEY: $CHECKSUM"
                        sed -i "s/^sha256sums_$KEY=.*\$/sha256sums_$KEY='$CHECKSUM'/" "$PKG_DIR/PKGBUILD"
                    done
                    # pin LICENSE to the tagged commit, matching _commit in the PKGBUILD
                    COMMIT=$(curl -fsSL --retry 5 --retry-all-errors "https://api.github.com/repos/ferronweb/ferron/git/ref/tags/$TARGET" | grep -oP '"sha":\s*"\K[a-f0-9]+' | head -1)
                    [ -n "$COMMIT" ] || { echo "ERROR: cannot resolve tag $TARGET"; exit 1; }
                    echo "  commit: $COMMIT"
                    sed -i "s/^_commit=.*\$/_commit=$COMMIT/" "$PKG_DIR/PKGBUILD"
                    curl -fsSL --retry 5 --retry-all-errors "https://raw.githubusercontent.com/ferronweb/ferron/$COMMIT/LICENSE" -o /tmp/LICENSE \
                        || { echo "ERROR: cannot fetch LICENSE for $COMMIT"; exit 1; }
                    LICENSE_SUM=$(sha256sum /tmp/LICENSE | cut -d ' ' -f 1)
                    sed -i "s/^sha256sums_LICENSE=.*\$/sha256sums_LICENSE='$LICENSE_SUM'/" "$PKG_DIR/PKGBUILD"
                else
                    # TARGET is already the upstream tag: 2.8.1, or 3.0.0-rc.11 for an RC
                    URL="https://github.com/ferronweb/ferron/archive/refs/tags/$TARGET.tar.gz"
                    echo "Downloading $URL"
                    curl -fsSL --retry 5 --retry-all-errors "$URL" -o /tmp/tarball \
                        || { echo "ERROR: cannot fetch $URL"; exit 1; }
                    SUM=$(sha256sum /tmp/tarball | cut -d ' ' -f 1)
                    echo "  tarball: $SUM"
                    sed -i "s/^sha256sums=.*\$/sha256sums=('$SUM')/" "$PKG_DIR/PKGBUILD"
                fi

            - name: Regenerate .SRCINFO
              run: |
                # makepkg refuses to run as root, and act's container is root.
                # Work in a scratch copy so a bind-mounted workspace keeps its
                # ownership, and only the generated .SRCINFO is copied back.
                PKG_DIR="packages/${{ matrix.pkg }}"
                rm -rf /tmp/srccheck && mkdir -p /tmp/srccheck
                cp -r "$PKG_DIR"/. /tmp/srccheck/
                if [ "$(id -u)" = "0" ]; then
                    id builder > /dev/null 2>&1 || useradd -m builder
                    chown -R builder:builder /tmp/srccheck
                    runuser -u builder -- bash -c '
                        cd /tmp/srccheck &&
                        CARCH=x86_64 makepkg --printsrcinfo > .SRCINFO
                    '
                else
                    cd /tmp/srccheck
                    CARCH=x86_64 makepkg --printsrcinfo > .SRCINFO
                fi
                test -s /tmp/srccheck/.SRCINFO
                cp /tmp/srccheck/.SRCINFO "$PKG_DIR/.SRCINFO"
                chmod 644 "$PKG_DIR/.SRCINFO"

            - name: Upload package
              uses: actions/upload-artifact@v5
              with:
                name: pkg-${{ matrix.pkg }}
                # .SRCINFO is a dotfile and gitignored; v4 silently drops
                # hidden files, so they have to be asked for
                include-hidden-files: true
                path: |
                    packages/${{ matrix.pkg }}/PKGBUILD
                    packages/${{ matrix.pkg }}/*.install
                    packages/${{ matrix.pkg }}/.SRCINFO
                if-no-files-found: error

    publish:
        needs: update
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Download packages
              uses: actions/download-artifact@v5
              with:
                path: artifacts
                pattern: pkg-*

            - name: Set up SSH for AUR
              env:
                AURSSHKEY: ${{ secrets.AURSSHKEY }}
                AURUSER: 'r1sk'
              run: |
                mkdir -p ~/.ssh
                echo "$AURSSHKEY" > ~/.ssh/aur_key
                chmod 600 ~/.ssh/aur_key
                cat > ~/.ssh/config << EOF
                Host aur.archlinux.org
                    IdentityFile ~/.ssh/aur_key
                    User $AURUSER
                EOF
                ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

            - name: Apply, commit and publish changed packages
              env:
                AURUSER: 'r1sk'
              run: |
                git config --global init.defaultBranch master
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"

                CHANGED=""
                for dir in artifacts/pkg-*; do
                    pkg=$(basename "$dir" | sed 's/^pkg-//')
                    cp -r "$dir"/. "packages/$pkg"/
                    # compare against HEAD without staging, so an ignored
                    # .SRCINFO never ends up in the GitHub commit
                    if ! git diff --quiet HEAD -- "packages/$pkg"; then
                        CHANGED="$CHANGED $pkg"
                    fi
                done

                if [ -z "$CHANGED" ]; then
                    echo "No package changed, nothing to publish"
                    exit 0
                fi

                git add packages
                git commit -m "Update packages: $CHANGED"
                git push origin master

                for pkg in $CHANGED; do
                    echo "Publishing $pkg"
                    git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur-$pkg"
                    cd "aur-$pkg"
                    # the AUR repo carries only PKGBUILD, the .install script and
                    # a generated .SRCINFO, nothing else from this repository
                    cp "../packages/$pkg/PKGBUILD" "../packages/$pkg"/*.install ./
                    cp "../packages/$pkg/.SRCINFO" ./
                    test -s .SRCINFO || { echo "ERROR: no .SRCINFO for $pkg"; exit 1; }
                    git add PKGBUILD *.install .SRCINFO
                    git config --local user.email "action@github.com"
                    git config --local user.name "GitHub Action"
                    if git diff --cached --quiet; then
                        echo "  $pkg already up to date on the AUR"
                    else
                        git commit -m "Update package"
                        git push origin master
                    fi
                    cd ..
                done
