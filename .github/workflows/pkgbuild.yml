name: PKGBUILD Updater

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:
    push:

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            stable: ${{ steps.ver.outputs.stable }}
            rc: ${{ steps.ver.outputs.rc }}
        steps:
            - name: Resolve upstream versions
              id: ver
              run: |
                STABLE=$(curl -fsL https://dl.ferron.sh/latest2.ferron)
                RC=$(curl -fsL https://dl.ferron.sh/latest3.ferron)
                echo "Latest stable: $STABLE"
                echo "Latest release candidate: $RC"
                echo "stable=$STABLE" >> $GITHUB_OUTPUT
                echo "rc=$RC" >> $GITHUB_OUTPUT

    update:
        needs: resolve
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - pkg: ferron
                      kind: stable
                    - pkg: ferronweb
                      kind: stable
                    - pkg: ferron-rc
                      kind: rc
                    - pkg: ferron-git
                      kind: git
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Determine target version
              id: target
              run: |
                case "${{ matrix.kind }}" in
                    stable) echo "version=${{ needs.resolve.outputs.stable }}" >> $GITHUB_OUTPUT ;;
                    rc) echo "version=${{ needs.resolve.outputs.rc }}" >> $GITHUB_OUTPUT ;;
                    git) echo "version=" >> $GITHUB_OUTPUT ;;
                esac

            - name: Update PKGBUILD
              id: upd
              run: |
                PKG_DIR="packages/${{ matrix.pkg }}"
                TARGET="${{ steps.target.outputs.version }}"
                CURRENT=$(grep -oP 'pkgver=\K[^\s]+' "$PKG_DIR/PKGBUILD")
                echo "current=$CURRENT target=$TARGET"

                # A VCS package carries no fixed version, so there is nothing to
                # bump on a schedule. It is republished only when its PKGBUILD
                # changes in this repository.
                if [ "${{ matrix.kind }}" = "git" ]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    exit 0
                fi

                if [ "$CURRENT" = "$TARGET" ]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                    exit 0
                fi

                sed -i "s/^pkgver=.*\$/pkgver=$TARGET/" "$PKG_DIR/PKGBUILD"
                sed -i 's/^pkgrel=.*$/pkgrel=1/' "$PKG_DIR/PKGBUILD"
                echo "changed=true" >> $GITHUB_OUTPUT

            - name: Update checksums
              if: steps.upd.outputs.changed == 'true'
              run: |
                PKG_DIR="packages/${{ matrix.pkg }}"
                TARGET="${{ steps.target.outputs.version }}"
                PKG="${{ matrix.pkg }}"

                if [ "$PKG" = "ferronweb" ]; then
                    for PKG_ARCH in x86_64 i686 armv7h aarch64 riscv64; do
                        case "$PKG_ARCH" in
                            armv7h) SRC_ARCH='armv7'; ABI='eabihf'; KEY='armv7' ;;
                            riscv64) SRC_ARCH='riscv64gc'; ABI=''; KEY='riscv64' ;;
                            *) SRC_ARCH="$PKG_ARCH"; ABI=''; KEY="$PKG_ARCH" ;;
                        esac
                        FILE_NAME="ferron-$TARGET-$SRC_ARCH-unknown-linux-gnu${ABI}.zip"
                        URL="https://dl.ferron.sh/$TARGET/$FILE_NAME"
                        echo "Downloading $URL"
                        curl -fsSL --retry 5 --retry-all-errors "$URL" -o "$FILE_NAME" || {
                            echo "ERROR: missing upstream build for $SRC_ARCH"
                            exit 1
                        }
                        CHECKSUM=$(sha256sum "$FILE_NAME" | cut -d ' ' -f 1)
                        echo "  $KEY: $CHECKSUM"
                        sed -i "s/^sha256sums_$KEY=.*\$/sha256sums_$KEY='$CHECKSUM'/" "$PKG_DIR/PKGBUILD"
                    done
                    LICENSE_SUM=$(curl -fsSL --retry 5 --retry-all-errors "https://github.com/ferronweb/ferron/raw/$TARGET/LICENSE" | sha256sum | cut -d ' ' -f 1)
                    sed -i "s/^sha256sums_LICENSE=.*\$/sha256sums_LICENSE='$LICENSE_SUM'/" "$PKG_DIR/PKGBUILD"
                else
                    TAG="$TARGET"
                    # upstream tags the RC as 3.0.0-rc.11 while pkgver must be 3.0.0rc.11
                    if [[ "$PKG" == "ferron-rc" ]]; then
                        TAG="${TARGET/rc./-rc.}"
                    fi
                    URL="https://github.com/ferronweb/ferron/archive/refs/tags/$TAG.tar.gz"
                    echo "Downloading $URL"
                    SUM=$(curl -fsSL --retry 5 --retry-all-errors "$URL" | sha256sum | cut -d ' ' -f 1)
                    echo "  tarball: $SUM"
                    sed -i "s/^sha256sums=.*\$/sha256sums=('$SUM')/" "$PKG_DIR/PKGBUILD"
                fi

            - name: Regenerate .SRCINFO
              run: |
                cd "packages/${{ matrix.pkg }}"
                CARCH=x86_64 makepkg --printsrcinfo > .SRCINFO

            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                name: pkg-${{ matrix.pkg }}
                path: packages/${{ matrix.pkg }}

    publish:
        needs: update
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Download packages
              uses: actions/download-artifact@v4
              with:
                path: artifacts
                pattern: pkg-*

            - name: Set up SSH for AUR
              env:
                AURSSHKEY: ${{ secrets.AURSSHKEY }}
                AURUSER: 'LunarN0v4'
              run: |
                mkdir -p ~/.ssh
                echo "$AURSSHKEY" > ~/.ssh/aur_key
                chmod 600 ~/.ssh/aur_key
                cat > ~/.ssh/config << EOF
                Host aur.archlinux.org
                    IdentityFile ~/.ssh/aur_key
                    User $AURUSER
                EOF
                ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

            - name: Apply, commit and publish changed packages
              env:
                AURUSER: 'LunarN0v4'
              run: |
                git config --global init.defaultBranch master
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"

                CHANGED=""
                for dir in artifacts/pkg-*; do
                    pkg=$(basename "$dir" | sed 's/^pkg-//')
                    cp -r "$dir"/. "packages/$pkg"/
                    # stage first, then ask git what actually differs
                    git add -f "packages/$pkg"
                    if ! git diff --cached --quiet -- "packages/$pkg"; then
                        CHANGED="$CHANGED $pkg"
                    fi
                done

                if [ -z "$CHANGED" ]; then
                    echo "No package changed, nothing to publish"
                    exit 0
                fi

                git add packages
                git commit -m "Update packages: $CHANGED"
                git push origin master

                for pkg in $CHANGED; do
                    echo "Publishing $pkg"
                    git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur-$pkg"
                    cd "aur-$pkg"
                    cp "../packages/$pkg/PKGBUILD" "../packages/$pkg"/*.install ./
                    git add PKGBUILD *.install .SRCINFO 2>/dev/null
                    git config --local user.email "action@github.com"
                    git config --local user.name "GitHub Action"
                    if git diff --cached --quiet; then
                        echo "  $pkg already up to date on the AUR"
                    else
                        git commit -m "Update package"
                        git push origin master
                    fi
                    cd ..
                done