name: PKGBUILD Updater

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:
    push:

jobs:
    pkgupdate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up environment
              run: |
                sudo apt-get update
                sudo apt-get install -y curl
                if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                  echo "MANUALTRIG=true" >> $GITHUB_ENV
                else
                  echo "MANUALTRIG=false" >> $GITHUB_ENV
                fi

            - name: Check latest version
              id: checkver
              run: |
                LATEST_VERSION=$(curl -fsL https://dl.ferron.sh/latest2.ferron)
                echo "Latest version: $LATEST_VERSION"
                CURRENT_VERSION=$(grep -oP 'pkgver=\K[^\s]+' packages/ferronweb/PKGBUILD)
                echo "Current version: $CURRENT_VERSION"
                echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
                echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
                if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
                    echo "UPDATENEEDED=true" >> $GITHUB_ENV
                else
                    echo "UPDATENEEDED=false" >> $GITHUB_ENV
                fi

            - name: Install makepkg
              if: env.UPDATENEEDED == 'true' || env.MANUALTRIG == 'true'
              run: |
                sudo apt-get -q -y install --no-install-recommends git pkg-config meson gcc libtool libgpgme-dev libarchive-dev ninja-build libcurl4-openssl-dev libssl-dev curl gettext python3 python3-setuptools dash gawk ca-certificates fakeroot fakechroot libarchive-tools
                sudo mkdir -p /usr/local/meson
                sudo git clone --depth=1 https://github.com/mesonbuild/meson.git /usr/local/meson
                [ -f /usr/bin/meson ] && {
                    mver=$(/usr/bin/meson --version)
                    sudo mv /usr/bin/meson /usr/bin/meson-${mver}
                }
                if [ -f /usr/local/meson/meson.py ]; then
                    sudo ln -s /usr/local/meson/meson.py /usr/bin/meson
                else
                    echo "ERROR: cannot locate /usr/local/meson/meson.py"
                    exit 1
                fi
                git clone --depth=1 https://gitlab.archlinux.org/pacman/pacman.git
                cd pacman
                meson setup -Ddoc=disabled build
                ninja -C build
                [ -d build ] || {
                    echo "Directory pacman/build does not exist. Exiting."
                    exit 1
                }
                cd build
                grep mirror scripts/libmakepkg/source/git.sh > /dev/null && {
                    cat scripts/libmakepkg/source/git.sh | sed -e "s/---mirror//" > /tmp/git$$
                    cp /tmp/git$$ scripts/libmakepkg/source/git.sh
                    rm -f /tmp/git$$
                }
                sudo meson install --no-rebuild --quiet
                cd ../..
                sudo rm -rf ./pacman

            - name: Update PKGBUILDs for all architectures
              if: env.UPDATENEEDED == 'true' || env.MANUALTRIG == 'true'
              run: |
                echo "Updating from version $CURRENT_VERSION to $LATEST_VERSION"
                sed -i "s/^pkgver=.*\$/pkgver=$LATEST_VERSION/" packages/ferronweb-bin/PKGBUILD
                sed -i "s/^pkgver=.*\$/pkgver=$LATEST_VERSION/" packages/ferronweb/PKGBUILD

                # pkgver bumps the source checksum too, the tarball changes with the tag
                SRCSUM=$(curl -fsSL "https://github.com/ferronweb/ferron/archive/refs/tags/$LATEST_VERSION.tar.gz" | sha256sum | cut -d ' ' -f 1)
                sed -i "s/^sha256sums=.*\$/sha256sums=('$SRCSUM')/" packages/ferronweb/PKGBUILD

                for PKG_ARCH in x86_64 i686 armv7h aarch64 riscv64; do
                    case "$PKG_ARCH" in
                        armv7h) SRC_ARCH='armv7'; ABI='eabihf'; KEY='armv7' ;;
                        riscv64) SRC_ARCH='riscv64gc'; ABI=''; KEY='riscv64' ;;
                        *) SRC_ARCH="$PKG_ARCH"; ABI=''; KEY="$PKG_ARCH" ;;
                    esac
                    echo "Processing $PKG_ARCH (upstream $SRC_ARCH, checksum key $KEY)"
                    FILE_NAME="ferron-$LATEST_VERSION-$SRC_ARCH-unknown-linux-gnu${ABI}.zip"
                    URL="https://dl.ferron.sh/$LATEST_VERSION/$FILE_NAME"
                    echo "Downloading: $URL"
                    curl -fsSL "$URL" -o "$FILE_NAME" || {
                        echo "ERROR: Missing upstream build for $SRC_ARCH"
                        exit 1
                    }
                    CHECKSUM=$(sha256sum "$FILE_NAME" | cut -d ' ' -f 1)
                    echo "Checksum for $KEY: $CHECKSUM"
                    sed -i "s/^sha256sums_$KEY=.*\$/sha256sums_$KEY='$CHECKSUM'/" packages/ferronweb-bin/PKGBUILD
                done
                cat packages/ferronweb-bin/PKGBUILD
                cat packages/ferronweb/PKGBUILD

            - name: Commit and push changes to GitHub
              if: env.UPDATENEEDED == 'true' || env.MANUALTRIG == 'true'
              run: |
                git config --global init.defaultBranch master
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add packages
                git diff --cached --quiet || git commit -m "Update to version $LATEST_VERSION"
                git push -u origin master || echo "Nothing to push"

            - name: Publish to AUR
              if: env.UPDATENEEDED == 'true' || env.MANUALTRIG == 'true'
              env:
                AURSSHKEY: ${{ secrets.AURSSHKEY }}
                AURUSER: 'LunarN0v4'
              run: |
                git config --global init.defaultBranch master
                mkdir -p ~/.ssh
                echo "$AURSSHKEY" > ~/.ssh/aur_key
                chmod 600 ~/.ssh/aur_key
                cat > ~/.ssh/config << EOF
                Host aur.archlinux.org
                    IdentityFile ~/.ssh/aur_key
                    User $AURUSER
                EOF
                ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

                for PKG in ferronweb ferronweb-bin ferronweb-git; do
                    echo "Publishing $PKG"
                    git clone ssh://aur@aur.archlinux.org/$PKG.git aur-$PKG
                    cd aur-$PKG
                    cp ../packages/$PKG/PKGBUILD ../packages/$PKG/ferron.install ./
                    makepkg --printsrcinfo > .SRCINFO
                    git config --local user.email "action@github.com"
                    git config --local user.name "GitHub Action"
                    git add PKGBUILD ferron.install .SRCINFO
                    git diff --cached --quiet || git commit -m "Update to version $LATEST_VERSION"
                    git push -u origin master || echo "Nothing to push for $PKG"
                    cd ..
                done